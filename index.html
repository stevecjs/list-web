<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>點名系統</title>
  
  <!-- PWA & iOS Safari Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="點">
  <link rel="apple-touch-icon" href="./assets/icon.svg">

  <!-- Local Stylesheets -->
  <link rel="stylesheet" href="./css/tailwind.min.css">
  <link rel="stylesheet" href="./css/custom.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">

  <!-- Top App Bar -->
  <header class="sticky top-0 z-40 glass-panel px-4 py-3 border-b border-slate-800 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl overflow-hidden shadow-lg shadow-sky-500/20 border border-sky-400/40 flex items-center justify-center bg-gradient-to-br from-slate-900 via-sky-950 to-sky-600">
        <span class="font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-300 to-white text-2xl leading-none">點</span>
      </div>
      <div>
        <h1 class="text-base font-extrabold tracking-tight text-white">
          AI 人臉辨識點名系統
        </h1>
        <div class="text-[11px] text-emerald-400 font-semibold flex items-center gap-1">
          <span id="ai-status-dot" class="w-2.5 h-2.5 rounded-full bg-yellow-500"></span>
          <span id="ai-status-text">AI 引擎模型載入中...</span>
        </div>
      </div>
    </div>
    <button id="btn-update-pwa" class="px-3 py-1.5 rounded-xl bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 text-xs font-extrabold border border-sky-500/40 active:scale-95 transition-all flex items-center gap-1 shadow-md">
      🔄 更新網頁
    </button>
  </header>

  <!-- Main Content Viewport -->
  <main class="flex-1 max-w-md w-full mx-auto p-3.5 space-y-4 mb-8">

    <!-- CAMERA & REAL-TIME AI FACE RECOGNITION BOX -->
    <div class="glass-panel p-4 rounded-2xl border border-slate-800 space-y-3 shadow-xl">
      <!-- Section Header Bar with Vector Badge & Collapse Button -->
      <div class="flex justify-between items-center">
        <span id="ai-vector-count-badge" class="text-[10px] px-2.5 py-1 rounded-full bg-sky-500/20 text-sky-300 font-mono border border-sky-500/30 font-bold">
          比對庫: 0 人 (0 筆特徵)
        </span>
        <button id="btn-toggle-camera-box" class="px-3 py-1 rounded-xl glass-card text-sky-300 hover:text-white font-bold text-xs border border-slate-700 transition-all flex items-center gap-1">
          <span id="camera-toggle-icon">🔼</span> <span id="camera-toggle-text">收起鏡頭區塊</span>
        </button>
      </div>

      <!-- Collapsible Container -->
      <div id="camera-box-content" class="space-y-3">
        <!-- Camera Preview Box with Face Overlay Canvas -->
        <div class="camera-container rounded-2xl overflow-hidden aspect-video relative bg-black border border-slate-800">
          <video id="main-video" class="camera-video w-full h-full object-cover" autoplay playsinline muted></video>
          <canvas id="face-canvas" class="absolute top-0 left-0 w-full h-full pointer-events-none z-10"></canvas>
          <div class="scan-line"></div>

          <!-- Success Animation Overlay -->
          <div id="match-success-banner" class="hidden absolute bottom-3 left-1/2 -translate-x-1/2 z-30 bg-emerald-500/95 backdrop-blur-md text-white px-4 py-2 rounded-full shadow-2xl flex items-center space-x-2 border border-emerald-300/50">
            <svg class="w-5 h-5 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
            <div class="text-xs font-extrabold"><span id="match-success-name">--</span> 點名成功！</div>
          </div>
        </div>

        <!-- Real-time AI Match Diagnostic Log -->
        <div id="ai-realtime-diag" class="p-2.5 bg-slate-900/90 rounded-xl border border-slate-800 text-[11px] font-mono space-y-1">
          <div class="flex justify-between text-slate-300">
            <span>實時比對歐氏距離：</span>
            <span id="diag-dist-reading" class="text-sky-400 font-bold">等待鏡頭開啟...</span>
          </div>
          <div class="flex items-center space-x-2 pt-1 border-t border-slate-800/80">
            <span class="text-slate-400 text-[10px] whitespace-nowrap">比對門檻:</span>
            <input type="range" id="threshold-slider" min="0.45" max="0.75" step="0.01" value="0.65" class="flex-1 accent-sky-400" />
            <span id="threshold-slider-val" class="text-sky-300 font-bold text-[11px] w-8 text-right">0.65</span>
          </div>
        </div>

        <!-- Camera Control Buttons -->
        <div class="space-y-2">
          <div class="flex gap-2 flex-wrap">
            <button id="btn-open-camera" class="flex-1 py-3 px-4 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-extrabold text-xs shadow-lg shadow-sky-500/25 active:scale-95 transition-all flex items-center justify-center gap-2">
              📷 開啟鏡頭並啟動 AI 辨識
            </button>
            <button id="btn-switch-camera" class="hidden py-3 px-3 rounded-xl glass-card text-sky-300 font-bold text-xs border border-slate-600">
              🔄 切換鏡頭
            </button>
            <button id="btn-refresh-camera" class="hidden py-3 px-3 rounded-xl glass-card text-emerald-300 font-bold text-xs border border-slate-600">
              ⚡ 重新整理鏡頭
            </button>
            <button id="btn-close-camera" class="hidden py-3 px-3 rounded-xl bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40 font-bold text-xs">
              🚫 關閉鏡頭
            </button>
          </div>

          <div class="flex gap-2 pt-1">
            <input 
              type="text" 
              id="reg-name-input" 
              placeholder="請輸入團員姓名 (例: 王小明)" 
              class="flex-1 px-3.5 py-2.5 rounded-xl bg-slate-900 border-2 border-sky-400 text-sky-300 placeholder-slate-400 font-bold text-sm focus:outline-none"
            />
            <button id="btn-ai-register" class="py-2.5 px-6 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-extrabold text-sm shadow-lg shadow-emerald-500/25 active:scale-95 transition-all">
              註冊
            </button>
          </div>
          <div id="reg-status-msg" class="text-xs font-bold text-sky-300 text-center min-h-[18px]">
            輸入姓名點擊「註冊」即可新增團員（開鏡頭可同步掃描 AI 特徵）
          </div>
        </div>
      </div>
    </div>

    <!-- LIVE ATTENDANCE BOARD -->
    <div class="glass-panel p-4 rounded-2xl border border-slate-800 space-y-3.5 shadow-xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <div>
          <h2 class="text-base font-extrabold text-white">即時點名看板</h2>
          <p class="text-xs text-slate-300">AI 辨識成功自動打勾 ‧ 亦可手動點擊補點</p>
        </div>
        <div class="text-right">
          <span class="text-2xl font-black text-emerald-400" id="present-count">0</span>
          <span class="text-sm text-slate-300 font-bold"> / <span id="total-count">0</span> 人</span>
        </div>
      </div>

      <!-- Action Toolbar -->
      <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
        <div class="flex items-center gap-1.5">
          <button id="btn-filter-all" class="px-3 py-1.5 rounded-xl bg-sky-500 text-white font-extrabold text-xs shadow-md">全體成員</button>
          <button id="btn-filter-selected" class="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs hover:text-white">挑選對象 (<span id="target-count-badge">0</span>)</button>
        </div>
        <button id="btn-open-target-modal" class="px-3 py-1.5 rounded-xl glass-card text-sky-300 font-extrabold text-xs border border-sky-500/40 hover:bg-sky-500/20 transition-all flex items-center gap-1">
          🎯 挑選對象
        </button>
      </div>

      <div class="flex gap-2 pt-1">
        <button id="btn-clear-board" class="flex-1 py-2 rounded-xl bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 text-xs font-bold border border-rose-500/40 flex items-center justify-center gap-1">
          🧹 清空看板紀錄
        </button>
        <button id="btn-copy-logs" class="flex-1 py-2 rounded-xl bg-gradient-to-r from-sky-500 to-indigo-600 text-white text-xs font-extrabold shadow-md flex items-center justify-center gap-1">
          📋 複製點名紀錄
        </button>
      </div>

      <!-- Attendance Cards Grid -->
      <div id="board-member-grid" class="grid grid-cols-1 gap-2.5 pt-2 max-h-[50vh] overflow-y-auto pr-1">
        <!-- Dynamic Cards -->
      </div>
    </div>

    <!-- REGISTERED MEMBERS MASTER LIST -->
    <div class="glass-panel p-4 rounded-2xl border border-slate-800 space-y-3">
      <h3 class="text-sm font-extrabold text-white">團員總名冊與特徵碼數量</h3>
      <div id="registered-member-list" class="space-y-2 max-h-48 overflow-y-auto">
        <!-- Member Items -->
      </div>
    </div>

  </main>

  <!-- MODAL: DYNAMIC TARGET SELECTOR -->
  <div id="target-modal" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-sm rounded-2xl p-4 border border-slate-700 space-y-3 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2.5">
        <h3 class="font-extrabold text-sm text-white">🎯 挑選本次點名對象</h3>
        <button id="btn-close-modal" class="text-slate-400 hover:text-white font-extrabold text-xl">&times;</button>
      </div>
      <div class="flex justify-between items-center text-xs">
        <div class="space-x-1.5">
          <button id="btn-select-all" class="px-2.5 py-1 rounded bg-sky-500/20 text-sky-300 border border-sky-500/30 font-bold">全選</button>
          <button id="btn-deselect-all" class="px-2.5 py-1 rounded bg-slate-800 text-slate-300 font-bold">全不選</button>
        </div>
        <span class="text-slate-300">已勾選 <b id="modal-checked-count" class="text-sky-400">0</b> 人</span>
      </div>
      <div id="target-checklist-container" class="space-y-2 max-h-64 overflow-y-auto border border-slate-800 p-2 rounded-xl bg-slate-900/80">
        <!-- Checklist -->
      </div>
      <button id="btn-save-target-selection" class="w-full py-2.5 bg-sky-500 hover:bg-sky-400 text-white font-extrabold rounded-xl text-xs shadow-lg">
        確認挑選對象
      </button>
    </div>
  </div>

  <!-- Load Scripts -->
  <script src="./js/face-api.min.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
